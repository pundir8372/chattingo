version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chattingo-frontend
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chattingo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chattingo-backend
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env    # or ./backend/.env
    volumes:
      - backend-logs:/var/log/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - chattingo-net

  mysql:
    image: mysql:8.0
    container_name: chattingo-database
    env_file:
      - ./backend/mysql.env     #
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - chattingo-net

volumes:
  db-data:
  backend-logs:

networks:
  chattingo-net:
    driver: bridge

